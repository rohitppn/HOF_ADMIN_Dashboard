[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/app/auth"
name = "whatsapp-auth"

[[deploy.volumes]]
mountPath = "/app/data"
name = "bot-data"

[[deploy.volumes]]
mountPath = "/app/exports"
name = "bot-exports"
